<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta property="og:title" content="Strothi IT Hub – Anwendungen für den Alltag">
  <meta property="og:description" content="Hub von Strothi It - verschiedene Anwendungen für den Alltag">
  <meta property="og:image" content="https://strothi.de/strothiit_icon.png">
  <meta property="og:url" content="https://strothi.de">
  <meta property="og:type" content="website">

  <title>Strothi Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <script>
    // Vor dem ersten Render setzen, damit kein falsches Theme aufblitzt.
    try {
      var theme = localStorage.getItem('theme')
      if (theme === 'light') document.documentElement.classList.add('light')
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
